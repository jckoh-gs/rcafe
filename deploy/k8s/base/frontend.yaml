apiVersion: v1
kind: Service
metadata:
  name: aicafe-frontend
  labels:
    app.kubernetes.io/name: aicafe-frontend
spec:
  selector:
    app.kubernetes.io/name: aicafe-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicafe-frontend
  labels:
    app.kubernetes.io/name: aicafe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aicafe-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aicafe-frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: aicafe-frontend
          env:
            - name: BACKEND_URL
              value: http://aicafe-backend.aicafe.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
