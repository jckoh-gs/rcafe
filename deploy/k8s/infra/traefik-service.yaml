# NOT part of the aicafe kustomization: it lives in kube-system and needs its own approval.
#
# Traefik is running in kube-system but has no Service, so nothing outside the cluster can reach it
# (the ingress-nginx Service that used to own the node's ports 80/443 was removed). This restores
# the same shape ingress-nginx had: a ClusterIP Service whose externalIPs is the node address, so
# traffic to <node-ip>:80/443 is forwarded to Traefik. Traefik listens on :80 and :443 inside the pod
# (verified with a port-forward: :80 answers, :8000 does not).
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
spec:
  type: ClusterIP
  externalIPs:
    - 121.143.126.21
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443
