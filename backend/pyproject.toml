[project]
name = "aicafe-backend"
version = "0.1.0"
description = "Weather-based cafe recommendation backend (FastAPI, hexagonal)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pgvector>=0.5.1",
]

[dependency-groups]
dev = ["ruff", "mypy", "import-linter", "pytest", "pytest-asyncio", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "ASYNC",         # blocking calls inside async functions
  "ANN",           # missing type annotations
  "SIM", "RUF",
]
ignore = ["ANN401"]  # allow explicit Any where unavoidable

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"migrations/**" = ["ANN"]

[tool.mypy]
files = ["app", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# adapters -> application -> domain.
[[tool.importlinter.contracts]]
name = "Hexagonal layers point inward"
type = "layers"
layers = ["app.main", "app.adapters", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "asyncpg", "httpx", "requests"]
